[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"   # Monad testnet also accepts Osaka opcodes (CLZ probed 2026-10-03); prague is the conservative target
network = "monad"        # Monad gas model in forge test/script (Foundry >= 1.8, O-7)
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "../packages/core/test/vectors" },
  { access = "read-write", path = "../deployments" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC}"
